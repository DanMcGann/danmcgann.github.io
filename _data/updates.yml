# Home page "Updates" section.
# To add an update, prepend a new entry (newest first).
#   - year:  four-digit year, e.g. 2026. Used for the card header and to group
#            past years into collapsible sections on the home page.
#     month: month label shown on the card, e.g. "Oct"
#     image: (optional) path to an image shown to the left of the text,
#     image_alt: (optional) alt text describing the image
#     items: list of bullet strings; Markdown (**bold**, [links](...)) is supported.
#            An item may instead be `sub:` with its own list to nest a second level.
- year: 2026
  month: "Oct"
  image: images/updates/2026_umich.png
  image_alt: "Univeristy of Michigan Logo"
  items:
    - "I started as a postdoctoral research fellow at the University of Michigan!"
    - sub:
        - I am excited to be working with Alan and Maani in the Department of Naval Architecture and Marine Engineering
