- id: rimesa
  title: "riMESA: Consensus ADMM for Real-World Collaborative SLAM"
  year: "2026"
  image: images/research/rimesa_header.png
  image_width: "100%"
  image_bg: true
  abstract: >-
    Collaborative Simultaneous Localization and Mapping (C-SLAM) is a
    fundamental capability for multi-robot teams as it enables downstream tasks
    like planning and navigation. However, existing C-SLAM back-end algorithms
    that are required to solve this problem struggle to address the practical
    realities of real-world deployments (i.e. communication limitations, outlier
    measurements, and online operation). In this paper we propose Robust
    Incremental Manifold Edge-based Separable ADMM (riMESA) -- a robust,
    incremental, and distributed C-SLAM back-end that is resilient to outliers,
    reliable in the face of limited communication, and can compute accurate
    state estimates for a multi-robot team in real-time. Through the development
    of riMESA, we, more broadly, make an argument for the use of Consensus
    Alternating Direction Method of Multipliers (C-ADMM) as a theoretical
    foundation for distributed optimization tasks in robotics like C-SLAM due to
    its flexibility, accuracy, and fast convergence. We conclude this work with
    an in-depth evaluation of riMESA on a variety of C-SLAM problem scenarios and
    communication network conditions using both synthetic and real-world C-SLAM
    data. These experiments demonstrate that riMESA is able to generalize across
    conditions, produce accurate state estimates, operate in real-time, and
    outperform the accuracy of prior works by a factor >7x on real-world
    datasets.
  venue: "IEEE Trans. on Robotics (TRO)"
  links:
    - { label: "Code", url: "https://github.com/rpl-cmu/rimesa" }
    - { label: "PDF", url: "./papers/TRO_2026_riMESA.pdf" }
    - { label: "arXiv", url: "https://arxiv.org/abs/2603.01178" }
    - { label: "IEEE Xplore", url: "https://ieeexplore.ieee.org/abstract/document/11575119" }
  bibtex: |
    @article{mcgann_rimesa_2026,
        title={ {riMESA}: Consensus {ADMM} for Real-World Collaborative {SLAM} },
        author={McGann, Daniel and Kaess, Michael},
        journal={IEEE Trans. on Robotics (TRO)},
        year={2026},
        volume={},  % Coming Soon
        number={},  % Coming Soon
        pages={}    % Coming Soon
    }

- id: cosmobench
  title: "COSMO-Bench: A Benchmark for Collaborative SLAM Optimization"
  year: "2026"
  image: images/research/cosmobench_header.jpg
  image_width: "100%"
  image_bg: true
  abstract: >-
    Recent years have seen a focus on research into distributed optimization
    algorithms for multi-robot Collaborative Simultaneous Localization and
    Mapping (C-SLAM). Research in this domain, however, is made difficult by a
    lack of standard benchmark datasets. Such datasets have been used to great
    effect in the field of single-robot SLAM, and researchers focused on
    multi-robot problems would benefit greatly from dedicated benchmark datasets.
    To address this gap, we design and release the Collaborative Open-Source
    Multi-robot Optimization Benchmark (COSMO-Bench) -- a suite of 24 datasets
    derived from a baseline C-SLAM front-end and real-world LiDAR data.
  venue: "IEEE Intl. Conf. on Robotics and Automation (ICRA)"
  links:
    - { label: "Dataset", url: "https://cosmobench.com" }
    - { label: "PDF", url: "./papers/ICRA_2026_COSMO-Bench.pdf" }
    - { label: "arXiv", url: "https://arxiv.org/abs/2508.16731" }
  bibtex: |
    @inproceedings{mcgann_cosmobench_2026,
        title = { {COSMO-Bench}: A Benchmark for Collaborative {SLAM} Optimization},
        author = {D. McGann and E.R. Potokar and M. Kaess},
        fullauthor = {Daniel McGann and Easton R. Potokar and Michael Kaess},
        year = 2026,
        booktitle = {Proc. IEEE Intl. Conf. on Robotics and Automation (ICRA)},
        address = {Vienna, {AT}},
        pages = {}, % Coming soon
    }

- id: imesa
  title: "iMESA: Incremental Distributed Optimization for Collaborative Simultaneous Localization and Mapping"
  year: "2024"
  image: images/research/imesa_high_level.png
  image_width: "100%"
  image_bg: true
  abstract: >-
    This paper introduces a novel incremental distributed back-end algorithm for
    Collaborative Simultaneous Localization and Mapping (C-SLAM). For real-world
    deployments, robotic teams require algorithms to compute a consistent state
    estimate accurately, within online runtime constraints, and with potentially
    limited communication. Existing centralized, decentralized, and distributed
    approaches to solving C-SLAM problems struggle to achieve all of these goals.
    To address this capability gap, we present Incremental Manifold Edge-based
    Separable ADMM (iMESA) a fully distributed C-SLAM back-end algorithm that can
    provide a multi-robot team with accurate state estimates in real-time with
    only sparse pair-wise communication between robots. Extensive evaluation on
    real and synthetic data demonstrates that iMESA is able to outperform
    comparable state-of-the-art C-SLAM back-ends.
  venue: "Robotics: Science and Systems (RSS)"
  links:
    - { label: "Code", url: "https://github.com/rpl-cmu/imesa" }
    - { label: "PDF", url: "./papers/RSS_2024_iMESA.pdf" }
    - { label: "arXiv", url: "https://arxiv.org/abs/2406.07371" }
    - { label: "RSS", url: "https://www.roboticsproceedings.org/rss20/p085.html" }
  bibtex: |
    @inproceedings{mcgann_imesa_2024,
        title = { {iMESA}: Incremental Distributed Optimization for Collaborative Simultaneous Localization and Mapping},
        author = {D. McGann and M. Kaess},
        fullauthor = {Daniel McGann and Michael Kaess},
        year = 2024,
        booktitle = {Proc. Robotics: Science and Systems (RSS)},
        address = {Delft, {NL}}
    }

- id: mesa
  title: "Asynchronous Distributed Smoothing and Mapping via On-Manifold Consensus ADMM"
  year: "2024"
  image: images/research/mesa_high_level.png
  image_width: "60%"
  abstract: >-
    In this paper we present a fully distributed, asynchronous, and general
    purpose optimization algorithm for Consensus Simultaneous Localization and
    Mapping (CSLAM). Multi-robot teams require that agents have timely and
    accurate solutions to their state as well as the states of the other robots
    in the team. To optimize this solution we develop a CSLAM back-end based on
    Consensus ADMM called MESA (Manifold, Edge-based, Separable ADMM). MESA is
    fully distributed to tolerate failures of individual robots, asynchronous to
    tolerate practical network conditions, and general purpose to handle any
    CSLAM problem formulation. We demonstrate that MESA exhibits superior
    convergence rates and accuracy compare to existing state-of-the art CSLAM
    back-end optimizers.
  venue: "IEEE Intl. Conf. on Robotics and Automation (ICRA)"
  awards:
    - "Finalist for Best Paper Award on Multi-Robot Systems"
  links:
    - { label: "Code", url: "https://github.com/rpl-cmu/mesa" }
    - { label: "PDF", url: "./papers/ICRA_2024_MESA.pdf" }
    - { label: "arXiv", url: "https://arxiv.org/abs/2310.12320" }
    - { label: "IEEE Xplore", url: "https://ieeexplore.ieee.org/abstract/document/10611193" }
  bibtex: |
    @inproceedings{mcgann_mesa_2024,
        title = {Asynchronous Distributed Smoothing and Mapping via On-Manifold Consensus {ADMM}},
        author = {D. McGann and K. Lassak and M. Kaess},
        fullauthor = {Daniel McGann and Kyle Lassak and Michael Kaess},
        year = 2024,
        booktitle = {Proc. IEEE Intl. Conf. on Robotics and Automation (ICRA)},
        address = {Yokohama, {JP}},
        pages = {4577-4583},
    }

- id: risam
  title: "Robust Incremental Smoothing and Mapping (riSAM)"
  year: "2023"
  image: images/research/risam_correct_mistake.gif
  image_width: "50%"
  abstract: >-
    This paper presents a method for robust optimization for online incremental
    Simultaneous Localization and Mapping (SLAM). Due to the NP-Hardness of data
    association in the presence of perceptual aliasing, tractable (approximate)
    approaches to data association will produce erroneous measurements. We
    require SLAM back-ends that can converge to accurate solutions in the presence
    of outlier measurements while meeting online efficiency constraints. Existing
    robust SLAM methods either remain sensitive to outliers, become increasingly
    sensitive to initialization, or fail to provide online efficiency. We present
    the robust incremental Smoothing and Mapping (riSAM) algorithm, a robust
    back-end optimizer for incremental SLAM based on Graduated Non-Convexity. We
    demonstrate on benchmarking datasets that our algorithm achieves online
    efficiency, outperforms existing online approaches, and matches or improves
    the performance of existing offline methods.
  venue: "IEEE Intl. Conf. on Robotics and Automation (ICRA)"
  links:
    - { label: "Code", url: "https://github.com/rpl-cmu/risam" }
    - { label: "PDF", url: "./papers/ICRA_2023_riSAM.pdf" }
    - { label: "arXiv", url: "https://arxiv.org/abs/2209.14359" }
    - { label: "IEEE Xplore", url: "https://ieeexplore.ieee.org/document/10161438" }
  bibtex: |
    @inproceedings{mcgann_risam_2023,
        title = {Robust Incremental Smoothing and Mapping ({riSAM})},
        author = {D. McGann and J. G. {Rogers III} and M. Kaess},
        fullauthor = {Daniel McGann and John G. Rogers III and Michael Kaess},
        year = 2023,
        booktitle = {Proc. IEEE Intl. Conf. on Robotics and Automation (ICRA)},
        address = {London, {GB}},
        pages = {4157-4163},
    }

- id: gps-denied-ugv
  title: "GPS-Denied Global Visual-Inertial Ground Vehicle State Estimation via Image Registration"
  year: "2022"
  image: images/research/gps_denied_path.jpg
  image_width: "75%"
  abstract: >-
    Robotic systems such as unmanned ground vehicles (UGVs) often depend on GPS
    for navigation in outdoor environments. In GPS-denied environments, one
    approach to maintain a global state estimate is localizing based on
    preexisting georeferenced aerial or satellite imagery. However, this is
    inherently challenged by the significantly differing perspectives between the
    UGV and reference images. In this paper, we introduce a system for global
    localization of UGVs in remote, natural environments. We use multi-stereo
    visual inertial odometry (MSVIO) to provide local tracking. To overcome the
    challenge of differing viewpoints we use a probabilistic occupancy model to
    generate synthetic orthographic images from color images taken by the UGV. We
    then derive global information by scan matching local images to existing
    reference imagery and then use a pose graph to fuse the measurements to
    provide uninterrupted global positioning after loss of GPS signal. We show
    that our system generates visually accurate orthographic images of the
    environment, provides reliable global measurements, and maintains an accurate
    global state estimate in GPS-denied conditions.
  venue: "IEEE Intl. Conf. on Robotics and Automation (ICRA)"
  links:
    - { label: "PDF", url: "./papers/ICRA_2022_Globally_Consistent_UGV_VIO.pdf" }
    - { label: "IEEE Xplore", url: "https://ieeexplore.ieee.org/document/9812364" }

